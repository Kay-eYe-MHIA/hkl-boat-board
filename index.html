<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>BOAT Status Board — HKL Emergency Department</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --bg:            #08090a;
    --row-a:         #1b1d16;
    --row-b:         #08090a;
    --hairline:      rgba(255,255,255,0.16);
    --ink-primary:   #ffffff;
    --ink-secondary: #e3e0d5;
    --ink-muted:     #a9a495;
    --amber:         #ffb02e;
    --amber-dim:     rgba(255,176,46,0.20);
    --critical:      #ff6b5e;
    --critical-dim:  rgba(255,107,94,0.20);
    --good:          #6fe07a;
    --mono: "Courier New", ui-monospace, "SFMono-Regular", Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--ink-primary);
    font-family: var(--sans);
    overflow: hidden;
  }
  body {
    display: flex; flex-direction: column;
    background-image:
      repeating-linear-gradient(180deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 3px);
  }

  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 36px 56px 26px;
    border-bottom: 2px solid var(--hairline);
    flex-shrink: 0;
  }
  .title-block .eyebrow {
    font-family: var(--mono); font-size: 17px; font-weight: 700;
    letter-spacing: 0.24em; color: var(--ink-muted); text-transform: uppercase;
  }
  .title-block h1 {
    margin: 8px 0 0; font-size: 52px; font-weight: 800; letter-spacing: 0.05em;
    color: var(--amber); text-transform: uppercase; text-shadow: 0 0 24px var(--amber-dim);
  }
  .status-block { text-align: right; font-family: var(--mono); }
  .clock { font-size: 46px; font-weight: 700; color: var(--ink-primary); font-variant-numeric: tabular-nums; letter-spacing: 0.04em; }
  .sync-line { font-size: 16px; color: var(--ink-muted); margin-top: 6px; letter-spacing: 0.05em; }
  .sync-line .live-dot {
    width: 10px; height: 10px; border-radius: 50%; background: var(--amber);
    display: inline-block; margin-right: 8px; animation: blink 2s ease-in-out infinite;
  }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }
  @media (prefers-reduced-motion: reduce) { .sync-line .live-dot { animation: none; } }

  .board-scroll {
    flex: 1; overflow: auto; display: flex; flex-direction: column;
    transition: opacity 0.35s ease;
  }
  .board-scroll.turning { opacity: 0; }

  .board-head {
    display: grid;
    grid-template-columns: 90px minmax(280px,1.4fr) minmax(170px,0.85fr) minmax(150px,0.75fr) minmax(260px,0.9fr) minmax(200px,0.95fr) 190px;
    gap: 0 26px;
    min-width: 1500px;
    padding: 22px 56px 16px;
    font-family: var(--mono); font-size: 16px; font-weight: 700;
    letter-spacing: 0.1em; color: var(--ink-muted); text-transform: uppercase;
    border-bottom: 2px solid var(--hairline);
    flex-shrink: 0;
  }
  .board-head .num { text-align: center; }

  #board { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .row {
    display: grid;
    grid-template-columns: 90px minmax(280px,1.4fr) minmax(170px,0.85fr) minmax(150px,0.75fr) minmax(260px,0.9fr) minmax(200px,0.95fr) 190px;
    gap: 0 26px;
    min-width: 1500px;
    flex: 0 0 16.6667%;
    align-items: center;
    padding: 20px 56px;
    border-bottom: 1px solid var(--hairline);
  }
  .row.a { background: var(--row-a); }
  .row.b { background: var(--row-b); }
  .row.critical { border-left: 8px solid var(--critical); }
  .row.critical .duration { color: var(--critical); }

  .cell { font-family: var(--mono); overflow: hidden; }
  .cell.num { text-align: center; color: var(--ink-muted); font-size: 30px; }
  .cell.name {
    font-family: var(--sans); font-weight: 700; font-size: 42px;
    letter-spacing: 0.01em; text-transform: uppercase; color: var(--ink-primary);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .cell.zone { font-size: 25px; color: var(--ink-secondary); letter-spacing: 0.02em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cell.ward { font-size: 27px; color: var(--ink-secondary); letter-spacing: 0.03em; }
  .cell.duration {
    font-size: 48px; font-weight: 700; color: var(--amber);
    font-variant-numeric: tabular-nums; letter-spacing: 0.02em;
  }
  .cell.staff {
    font-family: var(--sans); font-weight: 700; font-size: 26px; color: var(--good);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .cell.staff.unassigned {
    color: var(--amber); font-weight: 700; font-style: normal;
    letter-spacing: 0.04em; text-transform: uppercase; font-size: 22px;
  }
  .cell.status { display: flex; justify-content: flex-start; }
  .chip {
    font-family: var(--mono); font-size: 19px; font-weight: 700; letter-spacing: 0.08em;
    padding: 9px 20px; border-radius: 5px; border: 2px solid var(--amber);
    color: var(--amber); background: var(--amber-dim); text-transform: uppercase;
  }
  .row.critical .chip { border-color: var(--critical); color: var(--critical); background: var(--critical-dim); }

  .chip-blink { animation: chip-blink 1.1s ease-in-out infinite; }
  @keyframes chip-blink {
    0%, 100% { opacity: 1;    background: var(--amber-dim); }
    50%      { opacity: 0.45; background: transparent; }
  }
  .row.critical .chip-blink {
    animation-name: chip-blink-critical;
  }
  @keyframes chip-blink-critical {
    0%, 100% { opacity: 1;    background: var(--critical-dim); }
    50%      { opacity: 0.45; background: transparent; }
  }
  @media (prefers-reduced-motion: reduce) { .chip-blink { animation: none; } }

  .flip {
    animation: flip 0.5s ease-out;
    transform-origin: 50% 100%;
  }
  @keyframes flip {
    0%   { transform: rotateX(70deg); opacity: 0.2; }
    100% { transform: rotateX(0deg);  opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) { .flip { animation: none; } .board-scroll { transition: none; } }

  footer {
    display: flex; justify-content: space-between; align-items: center;
    padding: 20px 56px; border-top: 2px solid var(--hairline);
    font-family: var(--mono); font-size: 16px; color: var(--ink-muted);
    letter-spacing: 0.08em; text-transform: uppercase; flex-shrink: 0;
  }
  .error-banner {
    display: none; background: var(--critical-dim); color: var(--critical);
    font-family: var(--mono); font-size: 16px; padding: 12px 56px; letter-spacing: 0.05em;
  }
  .error-banner.show { display: block; }

  .empty-state {
    padding: 80px 56px; text-align: center; color: var(--ink-muted);
    font-family: var(--mono); font-size: 22px; letter-spacing: 0.1em; text-transform: uppercase;
  }

  #board::-webkit-scrollbar { width: 10px; }
  #board::-webkit-scrollbar-thumb { background: var(--hairline); border-radius: 6px; }
</style>
</head>
<body>

  <header>
    <div class="title-block">
      <div class="eyebrow">HKL &middot; Emergency Department</div>
      <h1>BOAT Status Board</h1>
    </div>
    <div class="status-block">
      <div class="clock" id="clock">00:00:00</div>
      <div class="sync-line"><span class="live-dot"></span><span id="syncLine">connecting&hellip;</span></div>
    </div>
  </header>

  <div class="error-banner" id="errorBanner"></div>

  <div class="board-scroll">
    <div class="board-head">
      <div class="num">#</div>
      <div>Patient Name</div>
      <div>ED Zone</div>
      <div>Ward</div>
      <div>Boat Duration</div>
      <div>Staff Incharge</div>
      <div>Status</div>
    </div>

    <div id="board"></div>
  </div>

  <footer>
    <span id="rowCount">0 patients awaiting transfer</span>
    <span id="pageIndicator"></span>
    <span>auto-refresh every <span id="intervalLabel">30</span>s</span>
  </footer>

<script>
(function () {
  // ---- CONFIG ----
  var WEBAPP_URL = "https://script.google.com/macros/s/AKfycbz4cd9upC8AAHM64zDLptE6sdCdGrf2ZlvoymFXJxiYxDuXW_yUjHCmMJs-qO0UsHZ4/exec"; // same /exec URL as boat_pull.py's WEBAPP_URL
  var SECRET_KEY = "MEjiHyP0leEnfAqyMvvj6cN3KU2TuZ"; // must match SECRET_KEY in the Apps Script
  var FETCH_INTERVAL_MS = 30000;
  var OVER60_HOURS = 60;
  var PAGE_SIZE = 6;
  var PAGE_ROTATE_MS = 8000;

  document.getElementById("intervalLabel").textContent = Math.round(FETCH_INTERVAL_MS / 1000);

  var boardEl = document.getElementById("board");
  var boardScrollEl = document.querySelector(".board-scroll");
  var errorEl = document.getElementById("errorBanner");
  var syncLineEl = document.getElementById("syncLine");
  var rowCountEl = document.getElementById("rowCount");
  var pageIndicatorEl = document.getElementById("pageIndicator");
  var clockEl = document.getElementById("clock");

  var patients = {}; // name -> { name, ward, baseSeconds, fetchedAt, lastRenderedText, el, over60 }
  var sortedList = []; // full sorted list across all pages
  var currentPage = 0;
  var lastFetchOk = null;

  function parseDurationToSeconds(str) {
    if (!str) return 0;
    var d = /(\d+)\s*day/.exec(str);
    var h = /(\d+)\s*hour/.exec(str);
    var m = /(\d+)\s*minute/.exec(str);
    var days = d ? parseInt(d[1], 10) : 0;
    var hours = h ? parseInt(h[1], 10) : 0;
    var mins = m ? parseInt(m[1], 10) : 0;
    return days * 86400 + hours * 3600 + mins * 60;
  }

  function formatSeconds(total) {
    var days = Math.floor(total / 86400);
    var hours = Math.floor((total % 86400) / 3600);
    var mins = Math.floor((total % 3600) / 60);
    if (days > 0) return days + "D " + hours + "H " + mins + "M";
    return hours + "H " + mins + "M";
  }

  function renderRow(p, rank, rowIndexOnPage) {
    var row = document.createElement("div");
    row.className = "row " + (rowIndexOnPage % 2 === 0 ? "a" : "b") + (p.over60 ? " critical" : "");
    var staffText = p.staffIncharge ? escapeHtml(p.staffIncharge) : "Unassigned";
    var staffClass = "cell staff" + (p.staffIncharge ? "" : " unassigned");
    row.innerHTML =
      '<div class="cell num">' + rank + '</div>' +
      '<div class="cell name">' + escapeHtml(p.name) + '</div>' +
      '<div class="cell zone">' + escapeHtml(p.zone || "&mdash;") + '</div>' +
      '<div class="cell ward">' + escapeHtml(p.ward || "&mdash;") + '</div>' +
      '<div class="cell duration"><span class="dur-text"></span></div>' +
      '<div class="' + staffClass + '">' + staffText + '</div>' +
      '<div class="cell status"><span class="chip' + (p.patient_status === "BOAT" ? " chip-blink" : "") + '">' + escapeHtml(p.patient_status || "BOAT") + '</span></div>';
    return row;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function totalPages() {
    return Math.max(1, Math.ceil(sortedList.length / PAGE_SIZE));
  }

  function renderPage(pageIndex) {
    // detach duration elements from every patient so tick() skips off-page rows
    Object.keys(patients).forEach(function (k) { patients[k].durEl = null; });

    boardEl.innerHTML = "";

    if (sortedList.length === 0) {
      var empty = document.createElement("div");
      empty.className = "empty-state";
      empty.textContent = "No BOAT patients currently recorded";
      boardEl.appendChild(empty);
      pageIndicatorEl.textContent = "";
      return;
    }

    var start = pageIndex * PAGE_SIZE;
    var slice = sortedList.slice(start, start + PAGE_SIZE);

    slice.forEach(function (p, i) {
      var row = renderRow(p, start + i + 1, i);
      boardEl.appendChild(row);
      p.el = row;
      p.durEl = row.querySelector(".dur-text");
      p.lastRenderedText = null;
    });

    pageIndicatorEl.textContent = totalPages() > 1
      ? "page " + (pageIndex + 1) + " of " + totalPages()
      : "";

    tick(); // populate duration text immediately, don't wait for next 1s tick
  }

  function rotatePage() {
    if (totalPages() <= 1) return;
    currentPage = (currentPage + 1) % totalPages();
    boardScrollEl.classList.add("turning");
    setTimeout(function () {
      renderPage(currentPage);
      boardScrollEl.classList.remove("turning");
    }, 350);
  }

  function applyFetch(rawPatients) {
    var now = Date.now();
    var newMap = {};
    rawPatients.forEach(function (r) {
      var seconds = parseDurationToSeconds(r.boat_duration_in_ed);
      newMap[r.name] = {
        name: r.name,
        zone: r.ed_zone,
        ward: r.assigned_ward,
        staffIncharge: r.staff_incharge,
        patient_status: r.patient_status,
        baseSeconds: seconds,
        fetchedAt: now,
        over60: seconds / 3600 > OVER60_HOURS
      };
    });

    // sort longest wait first
    sortedList = Object.keys(newMap).map(function (k) { return newMap[k]; })
      .sort(function (a, b) { return b.baseSeconds - a.baseSeconds; });

    patients = newMap;
    if (currentPage >= totalPages()) currentPage = 0;
    renderPage(currentPage);
    rowCountEl.textContent = sortedList.length + (sortedList.length === 1 ? " patient" : " patients") + " awaiting transfer";
  }

  function tick() {
    var now = Date.now();
    Object.keys(patients).forEach(function (k) {
      var p = patients[k];
      if (!p.durEl) return;
      var elapsed = Math.floor((now - p.fetchedAt) / 1000);
      var text = formatSeconds(p.baseSeconds + elapsed);
      if (text !== p.lastRenderedText) {
        p.durEl.textContent = text;
        if (p.lastRenderedText !== null) {
          p.durEl.parentElement.classList.remove("flip");
          void p.durEl.parentElement.offsetWidth; // restart animation
          p.durEl.parentElement.classList.add("flip");
        }
        p.lastRenderedText = text;
      }
    });

    var d = new Date();
    clockEl.textContent =
      String(d.getHours()).padStart(2, "0") + ":" +
      String(d.getMinutes()).padStart(2, "0") + ":" +
      String(d.getSeconds()).padStart(2, "0");
  }

  function fetchData() {
    fetch(WEBAPP_URL + "?key=" + encodeURIComponent(SECRET_KEY), { method: "GET", cache: "no-store" })
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function (data) {
        applyFetch(data.patients || []);
        lastFetchOk = new Date();
        errorEl.classList.remove("show");
        syncLineEl.textContent = "live — synced " + lastFetchOk.toLocaleTimeString();
      })
      .catch(function (err) {
        errorEl.textContent = "SYNC ERROR — " + err.message + " — showing last known data";
        errorEl.classList.add("show");
        syncLineEl.textContent = lastFetchOk
          ? "last synced " + lastFetchOk.toLocaleTimeString() + " (retrying)"
          : "connection failed (retrying)";
      });
  }

  if (WEBAPP_URL.indexOf("PASTE_") === 0) {
    errorEl.textContent = "CONFIG NEEDED — set WEBAPP_URL at the top of the <script> block to your Apps Script /exec URL";
    errorEl.classList.add("show");
  } else {
    fetchData();
    setInterval(fetchData, FETCH_INTERVAL_MS);
  }
  setInterval(tick, 1000);
  setInterval(rotatePage, PAGE_ROTATE_MS);
  tick();
})();
</script>
</body>
</html>
